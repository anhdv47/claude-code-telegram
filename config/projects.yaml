# Project registry for Telegram project threads.
# Paths are relative to APPROVED_DIRECTORY (/home/dvanh2).
# Each project gets its own Telegram topic via /sync_threads.
projects:
  - slug: general
    name: General / Home dir
    path: projects/general
    enabled: true

  - slug: baby-monitor
    name: Baby Monitor
    path: baby-monitor
    enabled: true

  - slug: sys-monitor
    name: Sys Monitor
    path: sys-monitor
    enabled: true

  - slug: f2b-ai
    name: Fail2ban AI
    path: f2b-ai
    enabled: true

  - slug: claude-code-telegram
    name: Claude Code Telegram
    path: claude-code-telegram
    enabled: true
